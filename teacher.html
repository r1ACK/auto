<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ครู | ระบบจัดตารางสอนอัตโนมัติ</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/timetable.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="teacher.html">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
      <span>ระบบจัดตารางสอนอัตโนมัติ<small>สำหรับครู</small></span>
    </a>
    <div class="topbar-right">
      <span class="user-chip" id="user-chip"></span>
      <button type="button" class="btn btn-secondary btn-sm" data-guide="teacher">คู่มือการใช้งาน</button>
      <button type="button" class="btn btn-ghost btn-sm" id="logout">ออกจากระบบ</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidenav" aria-label="เมนูหลัก">
      <div class="nav-group">ตารางสอน</div>
      <button type="button" data-nav="run" aria-current="page">จัดตารางสอน</button>
      <button type="button" data-nav="view">ดูตาราง</button>
      <div class="nav-group">ข้อมูลนำเข้า</div>
      <button type="button" data-nav="teachers">ข้อมูลครู <span class="count" data-count="teachers"></span></button>
      <button type="button" data-nav="groups">กลุ่มเรียน <span class="count" data-count="groups"></span></button>
      <button type="button" data-nav="rooms">ห้องเรียน <span class="count" data-count="rooms"></span></button>
      <button type="button" data-nav="subjects">รายวิชา <span class="count" data-count="subjects"></span></button>
      <button type="button" data-nav="import">นำเข้า / ส่งออก</button>
      <div class="nav-group">ระบบ</div>
      <button type="button" data-nav="users">ผู้ใช้งาน</button>
    </nav>

    <main class="content">
      <div class="mobile-nav">
        <label class="sr-only" for="mobile-nav-select">เมนู</label>
        <select class="input" id="mobile-nav-select">
          <option value="run">จัดตารางสอน</option>
          <option value="view">ดูตาราง</option>
          <option value="teachers">ข้อมูลครู</option>
          <option value="groups">กลุ่มเรียน</option>
          <option value="rooms">ห้องเรียน</option>
          <option value="subjects">รายวิชา</option>
          <option value="import">นำเข้า / ส่งออก</option>
          <option value="users">ผู้ใช้งาน</option>
        </select>
      </div>
      <div id="view-root">
        <div class="skeleton" style="height:48px;width:40%;margin-bottom:24px"></div>
        <div class="skeleton" style="height:260px"></div>
      </div>
    </main>
  </div>

  <script type="module" src="js/teacher-app.js"></script>
</body>
</html>
